<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Clinical Slate to Navy -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Axial Plane Cyan Accent Gradient -->
    <linearGradient id="axial-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Multi-Planar Orthogonal Depth Gradient -->
    <linearGradient id="depth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Subtle Inner Border -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Container Base with Soft Rounded Edges -->
  <rect width="64" height="64" rx="15" fill="url(#bg-grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Left Cerebral Hemisphere Contour -->
  <path d="M 30 14 C 23 14 16 18 16 26 C 16 31 18 34 16 38 C 14 42 16 48 22 50 C 26 51 28 48 30 46" 
        fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Right Cerebral Hemisphere Contour -->
  <path d="M 34 14 C 41 14 48 18 48 26 C 48 31 46 34 48 38 C 50 42 48 48 42 50 C 38 51 36 48 34 46" 
        fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Sagittal Midline Division (Longitudinal Fissure) -->
  <line x1="32" y1="13" x2="32" y2="47" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.7"/>

  <!-- Axial Volumetric Cross-Planes (Diagnostic Tomographic Slices) -->
  <!-- Top Axial Slice -->
  <path d="M 21 25 L 43 25" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Primary Central Axial Plane (Highlighted) -->
  <path d="M 17 33 L 47 33" stroke="url(#axial-grad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Lower Axial Slice -->
  <path d="M 20 41 L 44 41" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- 3D CBAM Volumetric Attention Core (Focal Node) -->
  <circle cx="32" cy="33" r="4.5" fill="#38bdf8"/>
  <circle cx="32" cy="33" r="2" fill="#ffffff"/>

  <!-- Synaptic / Neural Network Lateral Connectors -->
  <circle cx="23" cy="33" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="41" cy="33" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="26" cy="25" r="1.2" fill="#93c5fd" opacity="0.8"/>
  <circle cx="38" cy="25" r="1.2" fill="#93c5fd" opacity="0.8"/>
  <circle cx="26" cy="41" r="1.2" fill="#93c5fd" opacity="0.8"/>
  <circle cx="38" cy="41" r="1.2" fill="#93c5fd" opacity="0.8"/>
</svg>
